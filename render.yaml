services:
  # Single combined service: Backend API + Frontend Static Files
  - type: web
    name: healthcare-unthinkable
    runtime: node
    buildCommand: |
      cd frontend && npm install && npm run build && cd ../backend && npm install && npx prisma generate && npx prisma db push && npx tsc
    startCommand: cd backend && node dist/server.js
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        value: healthcare-jwt-secret-render-prod-2026
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LLM_PROVIDER
        value: mock
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
